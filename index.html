    "inputHelp": "그룹별로 값을 조정하세요. 각 항목 아래에 의미와 허용 범위가 표시됩니다.",
    "groupBehavior": "탐색 행동",
    "groupMetrics": "페이지 지표",
    "groupContext": "상황 정보",
    "rangeCount": "0 이상의 정수",
    "rangeDuration": "0 이상의 유한한 수, 초",
    "rangeRate": "0 ~ 1",
    "rangeChoice": "범주 하나 선택",
    "probabilityLabel": "추정 구매 확률",
    "advancedTitle": "모델 버전과 연구의 한계",
    "researchTitle": "연구 제목: 「온라인 구매 예측: 특성 조합에 따른 모델 성능 비교와 SHAP 해석」. 공개 데이터를 활용한 응용 모델 개발 및 수업 연구 결과이며 학술지 확장은 향후 가능한 방향입니다.",
    "footerNote": "이 단일 파일에는 모델 추론 매개변수와 예시 4개가 포함됩니다. 모델 기여도는 인과 효과가 아닙니다."
  }
};
  var locale='zh-Hant',currentActual=null,lastResult=null,lastInput=null,checked=null,activeExample=0;
  function el(id){return document.getElementById(id);}function text(){return TEXT[locale];}
  function createForm(){
    var groups=[['groupBehavior',MODEL.num_cols.filter(function(c){return c!=='BounceRates'&&c!=='ExitRates'&&c!=='SpecialDay';})],['groupMetrics',['BounceRates','ExitRates']],['groupContext',['SpecialDay'].concat(MODEL.cat_cols)]];
    groups.forEach(function(group){
      var fieldset=document.createElement('fieldset');fieldset.className='field-group';var legend=document.createElement('legend');legend.dataset.i18n=group[0];fieldset.appendChild(legend);var grid=document.createElement('div');grid.className='fields-grid';fieldset.appendChild(grid);el('form').appendChild(fieldset);
      group[1].forEach(function(c){
        var box=document.createElement('div');box.className='field';var label=document.createElement('label');label.htmlFor='f_'+c;var span=document.createElement('span');span.dataset.fieldLabel=c;label.appendChild(span);box.appendChild(label);
        var field=document.createElement(MODEL.num_cols.indexOf(c)!==-1?'input':'select');field.id='f_'+c;field.dataset.k=c;field.required=true;field.setAttribute('aria-describedby','input-errors hint_'+c);
        if(field.tagName==='INPUT'){field.type='number';field.min='0';field.step=COUNTS.indexOf(c)!==-1?'1':'any';if(RATES.indexOf(c)!==-1)field.max='1';}
        else MODEL.cats[c].forEach(function(v){var option=document.createElement('option');option.value=v;field.appendChild(option);});
        box.appendChild(field);var hint=document.createElement('p');hint.className='field-hint';hint.id='hint_'+c;hint.dataset.fieldHint=c;box.appendChild(hint);grid.appendChild(box);
        field.addEventListener('input',function(){currentActual=null;activeExample=null;compute();});field.addEventListener('change',function(){currentActual=null;activeExample=null;compute();});
      });
    });
  }
  function updateHints(){
    var t=text();FIELDS.forEach(function(c){var description=t.descriptions[c],range=t.rangeChoice;
      if(COUNTS.indexOf(c)!==-1){description=t.pageDescription;range=t.rangeCount;}else if(c.indexOf('_Duration')!==-1){description=t.durationDescription;range=t.rangeDuration;}
      else if(RATES.indexOf(c)!==-1){description=c==='BounceRates'?t.bounceDescription:c==='ExitRates'?t.exitDescription:t.specialDescription;range=t.rangeRate;}
      el('hint_'+c).textContent=description+' '+range;
    });
  }
  function optionLabel(c,v){var t=text();if(c==='Month')return t.months[v]||v;if(c==='VisitorType')return t.visitors[v]||v;if(c==='Weekend')return v==='1'?t.yes:t.no;return v;}
  function definitions(){
    var body=el('definitions'),t=text();body.textContent='';FIELDS.forEach(function(c){
      var description=t.descriptions[c],unit=t.category;
      if(COUNTS.indexOf(c)!==-1){description=t.pageDescription;unit=t.pages;}else if(c.indexOf('_Duration')!==-1){description=t.durationDescription;unit=t.seconds;}
      else if(RATES.indexOf(c)!==-1){description=c==='BounceRates'?t.bounceDescription:c==='ExitRates'?t.exitDescription:t.specialDescription;unit=t.ratio;}
      else if(c==='Month')unit=t.monthUnit;else if(c==='Weekend')unit=t.weekendUnit;else if(['OperatingSystems','Browser','Region','TrafficType'].indexOf(c)!==-1)unit=t.code;
      var row=document.createElement('tr');[t.fields[c]+' ('+c+')',description,unit].forEach(function(v){var cell=document.createElement('td');cell.textContent=v;row.appendChild(cell);});body.appendChild(row);
    });
  }
  function render(){
    document.querySelectorAll('button[data-ex]').forEach(function(b){b.setAttribute('aria-pressed',Number(b.dataset.ex)===activeExample?'true':'false');});
    var t=text(),errorBox=el('input-errors');errorBox.hidden=checked.valid;errorBox.textContent=checked.errors.map(function(e){return (t.fields[e.field]||e.field)+'：'+(locale==='ko'?ERRORS[e.message]:e.message);}).join('；');
    FIELDS.forEach(function(c){var e=checked.errors.filter(function(x){return x.field===c;})[0];el('f_'+c).setAttribute('aria-invalid',e?'true':'false');el('f_'+c).setCustomValidity(e?(locale==='ko'?ERRORS[e.message]:e.message):'');});
    var unknown=checked.valid?MODEL.cat_cols.filter(function(c){return MODEL.cats[c].indexOf(lastInput[c])===-1;}):[];el('category-warning').hidden=unknown.length===0;el('category-warning').textContent=unknown.length?t.unknown+unknown.map(function(c){return t.fields[c]+' ('+c+'='+lastInput[c]+')';}).join(', '):'';
    el('export-result').disabled=!checked.valid;el('meter').parentElement.hidden=!checked.valid;
    if(!checked.valid){el('prob').textContent='—';el('lvl').textContent=t.invalid;el('flag').textContent=t.fix;el('actual').textContent='';el('factors').textContent=t.fixFactors;el('meter').style.width='0%';return;}
    var r=lastResult;el('prob').textContent=(r.probability*100).toFixed(1)+'%';el('lvl').textContent=t.level+(r.probability>=0.5?t.high:r.flag?t.medium:t.low);el('flag').textContent=r.flag?t.flagYes:t.flagNo;el('actual').textContent=currentActual===null?'':currentActual?t.actualYes:t.actualNo;el('meter').style.width=Math.min(100,r.probability*100)+'%';
    var factors=el('factors');factors.textContent='';var max=Math.max.apply(null,r.top.map(function(x){return Math.abs(x.value);}))||1;
    r.top.forEach(function(x){var row=document.createElement('div');row.className='frow';var name=document.createElement('span');name.textContent=t.fields[x.name]||x.name;row.appendChild(name);var bar=document.createElement('div');bar.className='fbar';var fill=document.createElement('div');fill.className=x.value>0?'up':'down';fill.style.width=(Math.abs(x.value)/max*50).toFixed(1)+'%';fill.style[x.value>0?'left':'right']='50%';bar.appendChild(fill);row.appendChild(bar);var value=document.createElement('span');value.textContent=(x.value>0?t.up:t.down)+Math.abs(x.value).toFixed(2);row.appendChild(value);factors.appendChild(row);});
  }
  function compute(){var input={};FIELDS.forEach(function(c){input[c]=el('f_'+c).value;});checked=Mvp.validateInput(MODEL,input);lastInput=checked.valid?checked.value:null;lastResult=checked.valid?Mvp.predict(MODEL,lastInput):null;render();}
  function changeLanguage(){
    locale=el('language').value;var t=text();document.documentElement.lang=locale;document.title=t.title;document.querySelectorAll('[data-i18n]').forEach(function(node){node.textContent=t[node.dataset.i18n].replace('{version}',BUILD_INFO.modelVersion).replace('{date}',BUILD_INFO.modelRebuiltAtUtc);});document.querySelectorAll('[data-field-label]').forEach(function(node){node.textContent=t.fields[node.dataset.fieldLabel];});document.querySelectorAll('button[data-ex]').forEach(function(node){node.textContent=t.examples[Number(node.dataset.ex)];});
    MODEL.cat_cols.forEach(function(c){Array.prototype.forEach.call(el('f_'+c).options,function(option){option.textContent=optionLabel(c,option.value);});});definitions();updateHints();if(checked)render();
  }
  function loadExample(index){activeExample=index;var ex=EXAMPLES[index];FIELDS.forEach(function(c){el('f_'+c).value=String(ex.input[c]);});currentActual=ex.actual===1;compute();}
  function exportResult(){
    if(!checked.valid||!lastResult)return;var r=lastResult,t=text();var payload={schemaVersion:1,locale:locale,model:{version:BUILD_INFO.modelVersion,rebuiltAtUtc:BUILD_INFO.modelRebuiltAtUtc,modelJsonSha256:BUILD_INFO.modelJsonSha256,setting:'B',algorithm:'XGBoost',threshold:MODEL.threshold},input:lastInput,prediction:{probability:r.probability,margin:r.margin,flag:r.flag,level:r.probability>=0.5?'high':r.flag?'medium':'low',topShapLogOdds:r.top.map(function(x){return {feature:x.name,value:x.value};})},actual:currentActual,warnings:MODEL.cat_cols.filter(function(c){return MODEL.cats[c].indexOf(lastInput[c])===-1;}).map(function(c){return {code:'UNKNOWN_CATEGORY',feature:c,value:lastInput[c]};}),displayLabels:{result:t.exportLabels,features:t.fields}};
    var url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));var link=document.createElement('a');link.href=url;link.download='purchase-prediction-'+locale+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  createForm();el('reset-example').addEventListener('click',function(){loadExample(0);});el('language').addEventListener('change',changeLanguage);document.querySelectorAll('button[data-ex]').forEach(function(button){button.addEventListener('click',function(){loadExample(Number(button.dataset.ex));});});el('export-result').addEventListener('click',exportResult);changeLanguage();loadExample(0);
})();
</script>
